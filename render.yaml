# Render Blueprint — powers the one-click "Deploy to Render" button.
# https://render.com/docs/blueprint-spec
#
# FREE TIER = LIVE DEMO. Free instances have no persistent disk, so the SQLite
# map and uploaded images reset on every restart/redeploy. For a real store,
# run StoreMap on your own machine behind a free tunnel (see /self-host), or
# switch this service to `plan: starter` (~$7/mo) and add:
#   disk:
#     name: storemap-data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: storemap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SELF_HOSTED
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
